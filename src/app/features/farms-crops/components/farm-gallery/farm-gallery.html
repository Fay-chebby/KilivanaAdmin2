<section class="card">
  <header>
    <h2>Photos</h2>

    <div class="tabs" role="tablist" aria-label="Filter photos">
      <button
        type="button"
        role="tab"
        [class.on]="filter() === 'all'"
        [attr.aria-selected]="filter() === 'all'"
        (click)="setFilter('all')"
      >
        All {{ images().length }}
      </button>

      <button
        type="button"
        role="tab"
        [class.on]="filter() === 'farmer'"
        [attr.aria-selected]="filter() === 'farmer'"
        (click)="setFilter('farmer')"
      >
        {{ sellerLabel() }} {{ farmerCount() }}
      </button>

      <button
        type="button"
        role="tab"
        [class.on]="filter() === 'inspector'"
        [attr.aria-selected]="filter() === 'inspector'"
        (click)="setFilter('inspector')"
      >
        Inspector {{ inspectorCount() }}
      </button>
    </div>
  </header>

  @if (visible().length) {
    <ul class="grid">
      @for (p of visible(); track p.id ?? p.url; let i = $index) {
        <li [class.wide]="i === 0 && visible().length > 2">
          <button
            type="button"
            (click)="index.set(i)"
            [attr.aria-label]="'Open ' + (p.caption || 'photo')"
          >
            @if (imageUrl(p.url); as photoUrl) {
              <img [src]="photoUrl" [alt]="p.caption || 'Photo'" loading="lazy" />
            } @else {
              <span class="photo-placeholder">Loading photo…</span>
            }

            @if (p.uploadedBy) {
              <span class="tag" [attr.data-by]="p.uploadedBy">
                {{ p.uploadedBy === 'farmer' ? sellerLabel() : 'Inspector' }}
              </span>
            }

            @if (p.caption) {
              <span class="cap">{{ p.caption }}</span>
            }
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="empty">No photos here yet.</p>
  }
</section>

@if (current(); as p) {
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" (click)="close()">
    <button
      type="button"
      class="nav prev"
      aria-label="Previous photo"
      (click)="step(-1); $event.stopPropagation()"
    >
      ‹
    </button>

    <figure (click)="$event.stopPropagation()">
      @if (imageUrl(p.url); as photoUrl) {
        <img [src]="photoUrl" [alt]="p.caption || 'Photo'" />
      } @else {
        <p class="empty">Loading photo…</p>
      }

      <figcaption>
        {{ p.caption || 'Photo' }}

        @if (p.uploadedBy) {
          ·
          {{
            p.uploadedBy === 'farmer'
              ? 'Uploaded by ' + sellerLabel().toLowerCase()
              : 'Taken by inspector'
          }}
        }

        @if (p.uploadedAt) {
          · {{ p.uploadedAt }}
        }
      </figcaption>
    </figure>

    <button
      type="button"
      class="nav next"
      aria-label="Next photo"
      (click)="step(1); $event.stopPropagation()"
    >
      ›
    </button>

    <button type="button" class="x" aria-label="Close" (click)="close()">×</button>
  </div>
}
