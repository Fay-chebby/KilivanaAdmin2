<div class="backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3>{{ title() }}</h3>
    <p>
      Give these to {{ name() }}. This is the only time the password is shown. They must change it
      the first time they sign in.
    </p>
    <dl>
      <dt>Login email</dt>
      <dd>{{ email() }}</dd>
      <dt>Temporary password</dt>
      <dd class="pw">{{ password() }}</dd>
    </dl>
    <div class="actions">
      <button type="button" class="btn ghost" (click)="copy()">
        {{ copied() ? 'Copied' : 'Copy details' }}
      </button>
      <button type="button" class="btn" (click)="done.emit()">Done</button>
    </div>
  </div>
</div>
