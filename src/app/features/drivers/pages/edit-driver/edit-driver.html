@if (driver()) {
  <section class="edit-driver-page">
    <div class="page-header">
      <div>
        <h1>Edit {{ driver()!.fullName }}</h1>
        <p>{{ driver()!.code }}</p>
      </div>

      <button type="button" class="back-button" (click)="cancel()">Back</button>
    </div>

    @if (error()) {
      <div class="error-message">
        {{ error() }}
      </div>
    }

    <app-driver-form [driver]="driver()!" (saved)="save($event)" (cancelled)="cancel()" />
  </section>
} @else if (loading()) {
  <section class="loading-state">
    <p>Loading driver...</p>
  </section>
} @else {
  <section class="error-state">
    <h2>Driver not found</h2>

    <p>
      {{ error() || 'Unable to load the driver.' }}
    </p>

    <button type="button" (click)="cancel()">Back to Drivers</button>
  </section>
}
