<section class="card">
  <h2>Order pipeline</h2>

  <ol class="steps">
    @for (s of steps; track s; let i = $index) {
      <li
        [class.done]="isCompleted(i)"
        [class.current]="isCurrent(i) && !finished() && !halted()"
        [class.stop]="halted() && isCurrent(i)"
      >
        <span class="dot">
          @if (halted() && isCurrent(i)) {
            !
          } @else if (isCompleted(i) || (finished() && isCurrent(i))) {
            ✓
          } @else {
            {{ i + 1 }}
          }
        </span>

        <span class="txt">{{ s }}</span>
      </li>
    }
  </ol>
</section>
