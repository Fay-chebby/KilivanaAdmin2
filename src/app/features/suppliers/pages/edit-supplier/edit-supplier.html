<div class="page">
  <div class="breadcrumb">
    <a routerLink="/dashboard">AgriAdmin</a><span>/</span><a routerLink="/suppliers">Suppliers</a
    ><span>/</span>Edit
  </div>

  @if (loading()) {
    <div class="card missing"><p>Loading supplier…</p></div>
  } @else if (supplier(); as s) {
    <div class="page-head">
      <div>
        <h1>Edit {{ s.name }}</h1>
        <p>{{ s.code }}</p>
      </div>
    </div>
    <app-supplier-form
      [supplier]="s"
      [requirePassword]="false"
      submitLabel="Save Changes"
      [saving]="saving()"
      [error]="error()"
      (saved)="save($event)"
      (cancelled)="cancel()"
    />
  } @else {
    <div class="card missing">
      <p>Supplier not found.</p>
      <a class="btn" routerLink="/suppliers">Back to suppliers</a>
    </div>
  }
</div>
