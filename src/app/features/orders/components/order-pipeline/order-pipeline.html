<div class="pipeline" [class.cancelled]="isCancelled()" [class.disputed]="isDisputed()">
  @for (step of steps; track step; let i = $index) {
    <button
      type="button"
      class="pipeline-step"
      [class.completed]="i < currentIndex()"
      [class.current]="i === currentIndex()"
      [class.upcoming]="i > currentIndex()"
      [class.has-driver]="step === 'IN_TRANSIT' && driverAssigned()"
      [disabled]="!canSelectStatus(step)"
      (click)="changeStatus(step)"
    >
      <span class="step-icon">
        @if (i < currentIndex()) {
          <span class="check">✓</span>
        } @else if (step === 'IN_TRANSIT' && driverAssigned()) {
          <span class="check">✓</span>
        } @else {
          <span class="step-number">{{ i + 1 }}</span>
        }
      </span>

      <span class="step-label">
        {{ step.replace('_', ' ') }}
      </span>
    </button>

    @if (i < steps.length - 1) {
      <span class="pipeline-connector" [class.completed]="i < currentIndex()"></span>
    }
  }
</div>

@if (!driverAssigned() && !isCancelled() && !isDisputed()) {
  <button
    type="button"
    class="assign-driver-btn"
    [disabled]="busy()"
    (click)="requestDriverAssignment()"
  >
    Assign driver
  </button>
} @else if (driverAssigned()) {
  <div class="driver-assigned">
    <span class="driver-check">✓</span>
    Driver assigned successfully
  </div>
}
