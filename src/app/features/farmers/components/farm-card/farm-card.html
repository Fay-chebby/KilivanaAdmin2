<article class="farm">
  <header>
    <h4>{{ farm().name }}</h4>
    <app-farmer-badge [tone]="farm().status === 'active' ? 'green' : 'gray'">
      {{ farm().status === 'active' ? 'Active' : 'Fallow' }}
    </app-farmer-badge>
  </header>
  <p class="loc">{{ farm().location }}</p>
  <dl>
    <div>
      <dt>Size</dt>
      <dd>{{ farm().hectares }} ha</dd>
    </div>
    <div>
      <dt>Crops</dt>
      <dd>{{ farm().crops.join(', ') }}</dd>
    </div>
  </dl>
</article>
