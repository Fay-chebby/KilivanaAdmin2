<div class="backdrop" (click)="cancelled.emit()">
  <div class="modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h3>{{ title() }}</h3>
    <p>{{ message() }}</p>

    @if (askReason()) {
      <label for="reason">Reason (visible to the inspector)</label>
      <textarea
        id="reason"
        rows="3"
        [value]="reason()"
        (input)="reason.set($any($event.target).value)"
        placeholder="e.g. Missed three scheduled visits"
      ></textarea>
    }

    <div class="actions">
      <button type="button" class="btn ghost" (click)="cancelled.emit()">Cancel</button>
      <button
        type="button"
        class="btn"
        [class.danger]="danger()"
        [disabled]="!canConfirm()"
        (click)="confirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
