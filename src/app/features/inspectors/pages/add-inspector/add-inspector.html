<nav class="crumbs" aria-label="Breadcrumb">
  <a routerLink="/">AgriAdmin</a> / <a routerLink="/inspectors">Inspectors</a> / <span>Add</span>
</nav>
<a class="back" routerLink="/inspectors">← Back to inspectors</a>
<h1>Register Inspector</h1>
<div class="card">
  <p class="note">
    Register the inspector at the office. Check their original ID, capture the KYC photos, then hand
    over the login details.
  </p>
  <app-inspector-form
    mode="create"
    submitLabel="Register inspector"
    (saved)="save($event)"
    (cancelled)="cancel()"
  />
</div>

@if (created(); as c) {
  <app-credentials-modal
    title="Inspector registered"
    [name]="c.name"
    [email]="c.email"
    [password]="c.password"
    (done)="finish()"
  />
}
