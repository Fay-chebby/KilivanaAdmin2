<div class="status-select">
  <select
    [value]="status()"
    [attr.aria-label]="'Change order status'"
    (change)="changeStatus($event)"
    class="status-select__control"
    [class.status-placed]="status() === 'placed'"
    [class.status-confirmed]="status() === 'confirmed'"
    [class.status-processing]="status() === 'processing'"
    [class.status-shipped]="status() === 'shipped'"
    [class.status-delivered]="status() === 'delivered'"
    [class.status-cancelled]="status() === 'cancelled'"
  >
    @for (option of options; track option.value) {
      <option [value]="option.value">
        {{ option.label }}
      </option>
    }
  </select>
</div>
