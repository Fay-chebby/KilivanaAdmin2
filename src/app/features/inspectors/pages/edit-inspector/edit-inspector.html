<nav class="crumbs" aria-label="Breadcrumb">
  <a routerLink="/">AgriAdmin</a> / <a routerLink="/inspectors">Inspectors</a> / <span>Edit</span>

<a class="back" routerLink="/inspectors">← Back to inspectors</a>
<h1>Edit Inspector</h1>
<div class="card">
  @if (inspector(); as i) {
    <app-inspector-form
      mode="edit"
      [inspector]="i"
      submitLabel="Save changes"
      (saved)="save($event)"
      (cancelled)="cancel()"
    />
  } @else {
    <p class="note">Inspector not found.</p>
  }
</div>
