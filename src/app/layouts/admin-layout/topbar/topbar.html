<header class="topbar">
  <button type="button" class="icon-btn" (click)="toggleSidebar.emit()" aria-label="Toggle sidebar">
    <app-icon name="menu" [size]="18" />
  </button>

  <label class="search">
    <app-icon name="search" [size]="15" />
    <input type="text" placeholder="Search farmers, orders, buyers..." />
    <kbd>⌘K</kbd>
  </label>

  <div class="actions">
    <span class="role"><i></i>{{ user().role }}</span>

    <button type="button" class="icon-btn bell" aria-label="Notifications">
      <app-icon name="bell" [size]="17" />
      @if (unreadNotifications > 0) {
        <span class="bell__dot"></span>
      }
    </button>

    <div class="profile-menu">
      <button type="button" class="profile">
        <!-- <span class="profile__avatar">{{ user().initials }}</span> -->
        <span class="profile__name">{{ user().name }}</span>
        <app-icon name="chevron-down" [size]="13" />
      </button>
      <div class="profile-menu__dropdown">
        <span class="profile-menu__role">{{ user().role }}</span>
        <button type="button" (click)="logout()">Sign out</button>
      </div>
    </div>
  </div>
</header>
